<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log History | OJT-ERAMS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-portal="student">
  <div class="layout">
    <aside id="sidebar"></aside>
    <div class="main">
      <header id="topbar"></header>
      <section class="content">

        <div class="page-head"><div><h2 class="page-title">Log History</h2><p class="muted" id="summaryNote"></p></div>
          <button class="btn btn-outline" id="printBtn" type="button">🖨️ Print DTR</button></div>
        <div class="card">
          <div class="toolbar">
            <select class="input" id="fStatus">
              <option value="">All statuses</option><option value="APPROVED">Approved</option>
              <option value="PENDING_VERIFICATION">Pending</option><option value="REJECTED">Rejected</option><option value="TIMED_IN">On duty</option>
            </select>
          </div>
          <div class="table-wrap"><table class="logs-table">
            <thead><tr><th>Date</th><th>Time In / Out</th><th>Company</th><th>Hours</th><th>GPS</th><th>Status</th><th>Verified by</th></tr></thead>
            <tbody id="tbody"></tbody></table></div>
          <p class="muted center" id="emptyNote" hidden>No attendance logs yet.</p>
        </div>
      </section>
    </div>
  </div>
  <script src="js/boot.js" data-page="js/logs.js" data-with="dtr"></script>
</body>
</html>
